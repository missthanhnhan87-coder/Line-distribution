<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Stopwatch Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #1e1e24;
      color: #fff;
      padding: 15px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Controls Header */
    header {
      background: #2b2b36;
      padding: 12px 20px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      background: #4a4e69;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #9a8c98;
    }

    button.danger {
      background: #e63946;
    }

    button.danger:hover {
      background: #m02d3a;
    }

    input[type="number"], input[type="file"] {
      background: #1e1e24;
      color: #fff;
      border: 1px solid #4a4e69;
      padding: 6px 10px;
      border-radius: 6px;
    }

    /* Audio Player Component */
    .audio-player {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #22222b;
      padding: 6px 12px;
      border-radius: 6px;
    }

    .album-art {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: cover;
      display: none;
    }

    /* Members Grid (1 to 9 members) */
    .members-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      flex-grow: 1;
      height: calc(100vh - 100px);
      position: relative;
    }

    .member-card {
      background: #2b2b36;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.5s ease, top 0.5s ease, left 0.5s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      border: 1px solid #3d3d4e;
      position: relative;
    }

    .member-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1em;
      font-weight: bold;
      border-bottom: 1px solid #3d3d4e;
      padding-bottom: 4px;
    }

    .timer-display {
      font-size: 1.8em;
      font-family: monospace;
      text-align: center;
      color: #00f5d4;
      margin: 5px 0;
    }

    .lap-lines {
      background: #1e1e24;
      border-radius: 4px;
      padding: 5px;
      height: 60px;
      overflow-y: auto;
      font-size: 0.85em;
      font-family: monospace;
    }

    .lap-line {
      border-bottom: 1px dashed #3d3d4e;
      padding: 2px 0;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .card-actions button {
      flex: 1;
      padding: 6px;
      font-size: 0.8em;
    }
  </style>
</head>
<body>

  <header>
    <!-- General Controls -->
    <div class="control-group">
      <button onclick="addMember()">+ Member</button>
      <button class="danger" onclick="resetAll()">Reset All</button>
    </div>

    <!-- Max Time Setting -->
    <div class="control-group">
      <label for="maxTime">Max Time (s):</label>
      <input type="number" id="maxTime" value="0.0" step="0.5" min="0" style="width: 80px;" />
    </div>

    <!-- Auto Sort Toggle -->
    <div class="control-group">
      <label>Auto Sort:</label>
      <button id="sortToggleBtn" onclick="toggleAutoSort()">OFF</button>
    </div>

    <!-- MP3 Player & Picture Settings -->
    <div class="audio-player">
      <input type="file" id="mp3Input" accept="audio/mp3" onchange="loadAudio(event)" />
      <audio id="audio" controls style="height: 30px; width: 180px;"></audio>
      
      <button id="picToggleBtn" onclick="togglePicture()">Pic: OFF</button>
      <input type="file" id="imgInput" accept="image/*" style="display: none;" onchange="loadPicture(event)" />
      <img id="albumArt" class="album-art" alt="Cover" />
    </div>
  </header>

  <!-- Container for up to 9 members -->
  <div id="membersGrid" class="members-grid"></div>

  <script>
    let members = [];
    let autoSort = false;
    let showPic = false;
    let sortInterval = null;

    // Add a new member (Max 9)
    function addMember() {
      if (members.length >= 9) {
        alert("Maximum 9 members reached!");
        return;
      }

      const name = prompt("Enter Member Name:");
      if (!name || name.trim() === "") return;

      const member = {
        id: Date.now(),
        name: name.trim(),
        elapsedTime: 0,
        running: false,
        timerId: null,
        laps: []
      };

      members.push(member);
      renderMembers();
    }

    // Toggle stopwatch run/stop
    function toggleTimer(id) {
      const member = members.find(m => m.id === id);
      if (!member) return;

      if (member.running) {
        clearInterval(member.timerId);
        member.running = false;
      } else {
        const startTime = Date.now() - member.elapsedTime;
        member.running = true;
        member.timerId = setInterval(() => {
          member.elapsedTime = Date.now() - startTime;

          // Check Max Time condition
          const maxTimeVal = parseFloat(document.getElementById('maxTime').value);
          if (maxTimeVal > 0 && (member.elapsedTime / 1000) >= maxTimeVal) {
            member.elapsedTime = maxTimeVal * 1000;
            clearInterval(member.timerId);
            member.running = false;
          }

          updateMemberDisplay(member);
        }, 10);
      }
      renderMembers();
    }

    // Add a lap line for a member
    function addLap(id) {
      const member = members.find(m => m.id === id);
      if (!member) return;
      member.laps.push(formatTime(member.elapsedTime));
      renderMembers();
    }

    // Reset single member timer and lines
    function resetMember(id) {
      const member = members.find(m => m.id === id);
      if (!member) return;

      clearInterval(member.timerId);
      member.running = false;
      member.elapsedTime = 0;
      member.laps = [];
      renderMembers();
    }

    // Reset all members timers and lines
    function resetAll() {
      members.forEach(member => {
        clearInterval(member.timerId);
        member.running = false;
        member.elapsedTime = 0;
        member.laps = [];
      });
      renderMembers();
    }

    // Remove single member
    function removeMember(id) {
      const member = members.find(m => m.id === id);
      if (member) clearInterval(member.timerId);
      members = members.filter(m => m.id !== id);
      renderMembers();
    }

    // Format millisecond duration into mm:ss.ms
    function formatTime(ms) {
      const totalSeconds = ms / 1000;
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = Math.floor(totalSeconds % 60);
      const hundredths = Math.floor((ms % 1000) / 10);
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(hundredths).padStart(2, '0')}`;
    }

    // Update individual timer text dynamically without redrawing DOM
    function updateMemberDisplay(member) {
      const cardElem = document.getElementById(`card-${member.id}`);
      if (cardElem) {
        const timerElem = cardElem.querySelector('.timer-display');
        if (timerElem) timerElem.textContent = formatTime(member.elapsedTime);
      }
    }

    // Render grid of member cards
    function renderMembers() {
      const grid = document.getElementById('membersGrid');
      grid.innerHTML = '';

      members.forEach((member) => {
        const card = document.createElement('div');
        card.className = 'member-card';
        card.id = `card-${member.id}`;

        const lapsHtml = member.laps
          .map((lap, index) => `<div class="lap-line">Lap ${index + 1}: ${lap}</div>`)
          .join('');

        card.innerHTML = `
          <div class="member-header">
            <span>${member.name}</span>
            <button class="danger" style="padding: 2px 6px;" onclick="removeMember(${member.id})">✕</button>
          </div>
          <div class="timer-display">${formatTime(member.elapsedTime)}</div>
          <div class="lap-lines">${lapsHtml}</div>
          <div class="card-actions">
            <button onclick="toggleTimer(${member.id})">${member.running ? 'Stop' : 'Start'}</button>
            <button onclick="addLap(${member.id})">Lap</button>
            <button onclick="resetMember(${member.id})">Reset</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Auto Sort Handling
    function toggleAutoSort() {
      autoSort = !autoSort;
      const btn = document.getElementById('sortToggleBtn');
      btn.textContent = autoSort ? 'ON' : 'OFF';

      if (autoSort) {
        sortInterval = setInterval(() => {
          members.sort((a, b) => b.elapsedTime - a.elapsedTime);
          renderMembers();
        }, 1000); // Re-renders every second for smooth position updates
      } else {
        clearInterval(sortInterval);
      }
    }

    // Music & Picture Toggles
    function loadAudio(event) {
      const file = event.target.files[0];
      if (file) {
        const audio = document.getElementById('audio');
        audio.src = URL.createObjectURL(file);
      }
    }

    function togglePicture() {
      showPic = !showPic;
      const btn = document.getElementById('picToggleBtn');
      const imgInput = document.getElementById('imgInput');
      const albumArt = document.getElementById('albumArt');

      if (showPic) {
        btn.textContent = 'Pic: ON';
        imgInput.click();
      } else {
        btn.textContent = 'Pic: OFF';
        albumArt.style.display = 'none';
        albumArt.src = '';
      }
    }

    function loadPicture(event) {
      const file = event.target.files[0];
      if (file && showPic) {
        const albumArt = document.getElementById('albumArt');
        albumArt.src = URL.createObjectURL(file);
        albumArt.style.display = 'block';
      }
    }
  </script>
</body>
</html>
